name: CI

# Two jobs per run, on purpose.
#
# GitHub Free gives a public repo ~20 concurrent jobs. Eight parallel cards each
# pushing a card branch is 8 runs; with three lanes per run that is 24 jobs and
# everything queues behind everything. So the two Linux lanes (gcc-release and
# asan+ubsan) live in ONE job as two serial steps, and the run is exactly:
#
#     gates (Linux: core in Release, then core in ASan/UBSan)   +   windows
#
# 8 branches => 16 jobs => inside the quota, and CI -- not the 4-core dev box --
# is the authority on red/green (tools/local_gates.ps1 is the same gate locally,
# for the cases where waiting for a runner is the more expensive option).
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Same branch, new push: cancel the stale run instead of stacking them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # gates: the whole Linux side. Core is built twice (Release gcc, then Debug
  # clang with ASan+UBSan) because a sanitizer run is a different question about
  # the same code, not a different machine.
  # ===========================================================================
  gates:
    name: Gates + PrismCore (Linux)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: 1
    steps:
      - uses: actions/checkout@v4

      # ccache across runs: PrismCore is header-only, so almost every TU is a
      # full re-parse of 21 headers. Nothing else about this lane is expensive.
      # (ubuntu-latest does NOT ship ccache -- the first version of this workflow
      # assumed it did and every TU died with "/bin/sh: ccache: not found".
      # This action installs ccache and owns its cache, so nothing is assumed.)
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 500M

      # ---- lane 1: Release (gcc) ------------------------------------------
      - name: Configure (release-gcc preset, ccache launcher)
        run: >
          cmake --preset release-gcc -B build
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (Release)
        run: cmake --build build --parallel

      # ONE gate step. This used to be four separate steps (preflight, header
      # self-containment, Windows-TU typecheck, ctest). They are now the same
      # command a developer or agent runs locally:
      #
      #     pwsh -File tools/local_gates.ps1
      #
      # Why: the local script and the CI steps drifted apart twice -- a gate CI
      # ran that nobody ran locally (three Windows rounds), and a gate that
      # existed locally but was wired into nothing (tools/check_windows_tu.sh was
      # broken on main for a whole PR because no job called it). One entry point
      # cannot drift from itself (CONTRACTS D1).
      - name: Local gates (preflight + shell gates + manifest + ctest)
        run: >
          pwsh -NoProfile -File tools/local_gates.ps1
          -BuildDir build
          -Only presets,ctest,preflight,manifest,headers,windows_tu

      # ---- lane 2: Debug + ASan/UBSan (clang) ------------------------------
      - name: Configure (asan-clang preset)
        run: cmake --preset asan-clang -B build-asan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (ASan/UBSan)
        run: cmake --build build-asan --parallel
      - name: Test (ASan/UBSan)
        run: ctest --test-dir build-asan --output-on-failure --no-tests=error

      # ---- diagnostics: a red run has to be readable from the run page ----
      - name: Failed test names -> step summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Failed tests'
            echo '~~~'
            grep -hE '^\s*[0-9]+/[0-9]+ Test' build/Testing/Temporary/LastTest.log 2>/dev/null | grep -i 'failed' || true
            grep -hE '\*\*\*Failed|Failed +[0-9]' build/Testing/Temporary/LastTest.log 2>/dev/null | head -40 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-linux
          if-no-files-found: ignore
          retention-days: 5
          path: |
            build/local-gates/*.log
            build/Testing/Temporary/LastTest.log
            build-asan/Testing/Temporary/LastTest.log

      - name: ccache stats -> step summary
        if: always()
        run: ccache --show-stats | head -20 >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # windows: real MSVC build of the 7z.dll bridge + Win11 shell extension, a
  # real round-trip against the 7-Zip DLL in the runner image, under
  # AddressSanitizer, plus fxc.exe compilation of the Liquid Glass HLSL.
  # ===========================================================================
  windows:
    name: Windows (MSVC + ASan + 7z.dll + HLSL)
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # windows-latest no longer exposes a VS instance that CMake can find on
      # its own; this puts cl.exe + the SDK on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1

      # sccache, backed by the GitHub Actions cache. NOTE: this lane builds with
      # /fsanitize=address (see CMakePresets.json asan-msvc); sccache refuses to
      # cache ASan compiles on MSVC, so the launcher is deliberately NOT set here
      # -- a launcher that silently falls back to direct compilation would only
      # add a process hop. The Windows proof that matters is the build + the
      # 7z.dll suites below, and they are not slowed down by this.
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # The ASan flags are NOT spelled inline any more: they live in
      # CMakePresets.json's asan-msvc preset, which is the same preset a
      # developer runs locally (tools/local_gates.ps1 -Preset asan-msvc).
      # A preset that CI does not use rots; this lane is its proof.
      - name: Configure (asan-msvc preset)
        run: cmake --preset asan-msvc -B build

      - name: Probe SDK declaration of the COM entry points
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Filter combaseapi.h -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object {
              Select-String -Path $_.FullName -Pattern "DllGetClassObject" -Context 3,3 |
                Select-Object -First 2 | ForEach-Object { $_.Context.PreContext + $_.Line + $_.Context.PostContext }
            }

      - name: Build
        run: cmake --build build --parallel

      - name: Locate 7z.dll
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\7-Zip\7z.dll",
            "${env:ProgramFiles(x86)}\7-Zip\7z.dll",
            "$env:LOCALAPPDATA\Programs\7-Zip\7z.dll")
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "7z.dll: $found"
            "PRISM_7Z_DLL=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "::warning::7z.dll not found - integration test will SKIP"
          }

      - name: Test
        working-directory: build
        shell: bash
        env:
          # Report-only lanes are excluded from the MERGE gate and run in
          # report.yml instead. They are not correctness proofs: bench_scale
          # packs and extracts a 4 GiB fixture (64 s alone) and the fuzz smoke
          # feeds 10k samples, which together pushed this lane past 8 minutes
          # and slowed every merge. What stays here is everything that can
          # actually go wrong in shipped code.
          PRISM_CTEST_EXCLUDE: "bench|fuzz"
        run: |
          ctest --output-on-failure --no-tests=error -E "$PRISM_CTEST_EXCLUDE" 2>&1 | tee "$RUNNER_TEMP/prism_test.log"
          exit ${PIPESTATUS[0]}

      # The Windows half of the same local gate: proves CMakePresets.json parses
      # on a real MSVC host and that preflight runs there too. The two POSIX
      # shell gates cannot run on a Windows runner without WSL -- the gates job
      # above runs them for real. Cheap on purpose: the expensive Windows proofs
      # are the build + ctest above.
      - name: "Local gates (Windows side: presets + preflight)"
        run: pwsh -NoProfile -File tools/local_gates.ps1 -BuildDir build -Only presets,preflight

      - name: Upload the runnable app (batch A)
        uses: actions/upload-artifact@v4
        with:
          name: PrismArchive-exe
          path: build/Src/PrismWin/PrismArchive.exe
          if-no-files-found: error

      # Diagnostics: failed test names + the raw log, so a red run is readable
      # from the run page without anyone re-running it locally.
      - name: Failed test names -> step summary
        if: failure()
        shell: bash
        run: |
          {
            echo '### Failed tests'
            echo '~~~'
            grep -E '^\s*[0-9]+/[0-9]+ Test' "$RUNNER_TEMP/prism_test.log" 2>/dev/null | grep -Ei 'failed|timeout' || true
            grep -E 'Failed|\*\*\*' "$RUNNER_TEMP/prism_test.log" 2>/dev/null | head -40 || true
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-windows
          if-no-files-found: ignore
          retention-days: 5
          path: |
            ${{ runner.temp }}/prism_test.log
            build/Testing/Temporary/LastTest.log

      # Headless design review: the gallery renderer paints the real D2D code
      # path to PNGs; uploaded as artifacts so the design is reviewable
      # directly from the run.
      - name: Render design snapshots
        working-directory: build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/design"
          ./Tests/gallery_snapshot.exe "$RUNNER_TEMP/design"

      - name: Upload design snapshots
        uses: actions/upload-artifact@v4
        with:
          name: design-snapshots
          path: ${{ runner.temp }}/design/*.png
          if-no-files-found: warn

      # The sandbox this project is developed from cannot always reach
      # blob.core.windows.net (where job logs live), so mirror the test output
      # to a commit comment over api.github.com.
      - name: Mirror test output to a commit comment
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Get-Content "$env:RUNNER_TEMP/prism_test.log" -Raw -ErrorAction SilentlyContinue
          if (-not $log) { exit 0 }
          $tail = $log.Substring([Math]::Max(0, $log.Length - 3500))
          $fence = ([string][char]96) * 3
          $nl = [Environment]::NewLine
          $body = "Windows test output (tail):" + $nl + $fence + "text" + $nl + $tail + $nl + $fence
          $json = @{ body = $body } | ConvertTo-Json
          $json | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -X POST --input - | Out-Null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile HLSL (Liquid Glass optics)
        shell: pwsh
        run: |
          python tools/hlsl/compile_hlsl.py --strict

      # Performance benchmark (blueprint ch. 7.2): the real solid-sweep vs
      # per-item numbers, appended to the run summary so every CI visitor sees
      # digits instead of adjectives.
      - name: Performance benchmark -> step summary
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          ./Tests/win_bench_solid.exe | tee "$RUNNER_TEMP/prism_bench.log"
          status=${PIPESTATUS[0]}
          fence=$(printf '\140\140\140')
          {
            echo "### Solid sweep benchmark (Windows lane)"
            echo "$fence""json"
            grep -E '^BENCH \{' "$RUNNER_TEMP/prism_bench.log" | sed 's/^BENCH //'
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
