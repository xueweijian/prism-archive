name: Bench (on-demand test machine)

# A clean Windows and Linux machine I can drive from the agent session.
#
# Why this exists: the dev box is 4 cores and is usually running several cards
# at once, so a local ctest is both slow and noisy -- and "it passed on my
# machine" is exactly the kind of evidence this project does not accept. This
# workflow lets me run any subset on a fresh runner, read the log as an
# artifact, and use the same runner to drive the installer end to end.

on:
  workflow_dispatch:
    inputs:
      ctest_regex:
        description: "ctest -R regex (empty = all tests)"
        required: false
        default: ""
      exclude:
        description: "ctest -E regex (default skips the report-only lanes)"
        required: false
        default: "bench|fuzz"
      run_installer:
        description: "Also install, then drive the shell verbs against the installed exe"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows bench
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Locate 7z.dll
        shell: pwsh
        run: |
          $c = @("$env:ProgramFiles\7-Zip\7z.dll", "${env:ProgramFiles(x86)}\7-Zip\7z.dll") |
               Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($c) { "PRISM_7Z_DLL=$c" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append }
          Write-Host "7z.dll: $c"

      - name: Test
        shell: bash
        working-directory: build
        run: |
          set -o pipefail
          R="${{ inputs.ctest_regex }}"
          E="${{ inputs.exclude }}"
          if [ -n "$R" ]; then
            ctest -R "$R" -E "$E" --output-on-failure --no-tests=error 2>&1 | tee "$RUNNER_TEMP/bench.log"
          else
            ctest -E "$E" --output-on-failure --no-tests=error 2>&1 | tee "$RUNNER_TEMP/bench.log"
          fi

      - name: Installer + shell verbs (optional)
        if: ${{ inputs.run_installer }}
        shell: pwsh
        run: |
          $src = "build\Src\PrismWin"
          pwsh -NoProfile -File tools/install.ps1 -SourceDir $src -SevenZipDll $env:PRISM_7Z_DLL
          $exe = "$env:LOCALAPPDATA\PrismArchive\PrismArchive.exe"
          $dir = Join-Path $env:RUNNER_TEMP "verbs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content "$dir\a.txt" "alpha"; Set-Content "$dir\b.txt" "beta"
          & "C:\Program Files\7-Zip\7z.exe" a -t7z "$dir\pack.7z" "$dir\a.txt" | Out-Null
          $cases = @(
            @{ f = "--compress-7z"; a = @("$dir\a.txt","$dir\b.txt") },
            @{ f = "--compress-zip"; a = @("$dir\a.txt","$dir\b.txt") },
            @{ f = "--smart-extract-each"; a = @("$dir\pack.7z") },
            @{ f = "--extract-here"; a = @("$dir\pack.7z") },
            @{ f = "--test"; a = @("$dir\pack.7z") }
          )
          $bad = 0
          foreach ($c in $cases) {
            $args = @($c.f) + $c.a
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -RedirectStandardError "$dir\err.txt"
            if (-not $p.WaitForExit(20000)) { $p.Kill(); Write-Host "HUNG: $($c.f)"; $bad++; continue }
            Write-Host ("{0} exit={1}" -f $c.f, $p.ExitCode)
            if ($p.ExitCode -ne 0) { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad verb(s) failed" }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows
          path: ${{ runner.temp }}/bench.log

  linux:
    name: Linux bench
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        shell: bash
        working-directory: build
        run: |
          set -o pipefail
          R="${{ inputs.ctest_regex }}"
          if [ -n "$R" ]; then ctest -R "$R" --output-on-failure --no-tests=error 2>&1 | tee bench.log
          else ctest --output-on-failure --no-tests=error 2>&1 | tee bench.log; fi
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: build/bench.log
