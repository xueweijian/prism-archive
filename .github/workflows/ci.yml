name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # PrismCore: the platform-neutral brain. Builds and tests on Linux in seconds
  # so every rule (smart extraction, Zip Slip, bomb fuse, CJK repair, CoW tree)
  # is verified without a Windows host.
  # -------------------------------------------------------------------------
  core:
    name: PrismCore (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            build-type: Release
            cxx: g++
            configure-args: ""
          - name: asan+ubsan
            build-type: Debug
            cxx: clang++
            configure-args: >-
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DPRISM_BUILD_WIN_LAYER=OFF
          ${{ matrix.configure-args }}
      - name: Build
        run: cmake --build build --parallel
      - name: Preflight gate (contracts as deterministic checks)
        # docs/CONTRACTS.md entries as greps: B1/B2/B5/B6/ARCH/D1. Runs in
        # seconds and keeps the repeat error classes from ever costing a CI
        # round again (30/60 red runs this session; half were repeat classes).
        run: python3 tools/preflight.py
      - name: Header self-containment gate
        # A header must compile alone AND include what it uses: relying on a
        # transitive <regex> pull-in for <cstdint> passes locally and fails on
        # the runner (libstdc++ version difference). This gate is lexical and
        # deterministic, so it cannot drift.
        run: sh tools/check_headers.sh
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # Windows: real MSVC build of the 7z.dll bridge + Win11 shell extension,
  # plus a real round-trip against the 7-Zip DLL shipped in the runner image,
  # plus fxc.exe compilation of the Liquid Glass HLSL.
  # -------------------------------------------------------------------------
  windows:
    name: Windows (MSVC + 7z.dll + HLSL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest no longer exposes a VS instance that CMake can find on
      # its own; this puts cl.exe + the SDK on PATH for the Ninja generator.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Probe SDK declaration of the COM entry points
        shell: pwsh
        continue-on-error: true
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Filter combaseapi.h -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object {
              Select-String -Path $_.FullName -Pattern "DllGetClassObject" -Context 3,3 |
                Select-Object -First 2 | ForEach-Object { $_.Context.PreContext + $_.Line + $_.Context.PostContext }
            }

      - name: Build
        run: cmake --build build --parallel

      - name: Locate 7z.dll
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\7-Zip\7z.dll",
            "${env:ProgramFiles(x86)}\7-Zip\7z.dll",
            "$env:LOCALAPPDATA\Programs\7-Zip\7z.dll")
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) {
            Write-Host "7z.dll: $found"
            "PRISM_7Z_DLL=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "::warning::7z.dll not found - integration test will SKIP"
          }

      - name: Test
        working-directory: build
        shell: bash
        run: |
          ctest --output-on-failure --no-tests=error 2>&1 | tee "$RUNNER_TEMP/prism_test.log"
          exit ${PIPESTATUS[0]}

      # Headless design review: the gallery renderer paints the real D2D code
      # path to PNGs; uploaded as artifacts so the design is reviewable
      # directly from the run.
      - name: Render design snapshots
        working-directory: build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/design"
          ./Tests/gallery_snapshot.exe "$RUNNER_TEMP/design"

      - name: Upload design snapshots
        uses: actions/upload-artifact@v4
        with:
          name: design-snapshots
          path: ${{ runner.temp }}/design/*.png
          if-no-files-found: warn

      # The sandbox this project is developed from cannot always reach
      # blob.core.windows.net (where job logs live), so mirror the test output
      # to a commit comment over api.github.com.
      - name: Mirror test output to a commit comment
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          $log = Get-Content "$env:RUNNER_TEMP/prism_test.log" -Raw -ErrorAction SilentlyContinue
          if (-not $log) { exit 0 }
          $tail = $log.Substring([Math]::Max(0, $log.Length - 3500))
          $body = "Windows test output (tail):`n``````text`n$tail`n``````"
          $json = @{ body = $body } | ConvertTo-Json
          $json | gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -X POST --input - | Out-Null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compile HLSL (Liquid Glass optics)
        shell: pwsh
        run: |
          python tools/hlsl/compile_hlsl.py --strict

      # Performance benchmark (blueprint ch. 7.2): the real solid-sweep vs
      # per-item numbers, appended to the run summary so every CI visitor sees
      # digits instead of adjectives. Appended AFTER the existing steps -- the
      # lane structure above is untouched.
      - name: Performance benchmark -> step summary
        working-directory: build
        shell: bash
        run: |
          set -o pipefail
          ./Tests/win_bench_solid.exe | tee "$RUNNER_TEMP/prism_bench.log"
          status=${PIPESTATUS[0]}
          {
            echo "### Solid sweep benchmark (Windows lane)"
            echo '```json'
            grep -E '^BENCH \{' "$RUNNER_TEMP/prism_bench.log" | sed 's/^BENCH //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
